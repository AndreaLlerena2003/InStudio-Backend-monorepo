version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  mongodb-booking-service:
    image: docker.io/bitnami/mongodb:5.0  
    environment:
      - MONGODB_ROOT_PASSWORD=password123  
    volumes:
      - 'mongodb-booking-service_data:/bitnami/mongodb'  
    ports:
      - '27017:27017'  

  mongodb-offers-service:
    image: docker.io/bitnami/mongodb:5.0  
    environment:
      - MONGODB_ROOT_PASSWORD=password123
    volumes:
      - 'mongodb-offers-service_data:/bitnami/mongodb'  
    ports:
      - '27018:27017'  

  admin-service-1:
    image: postgres:14
    environment:
      POSTGRES_DB: admin-service
      POSTGRES_USER: user1
      POSTGRES_PASSWORD: password1
    volumes:
      - 'admin-service-1_data:/var/lib/postgresql/data'
    ports:
      - '5632:5432'

  user-service-2:
    image: postgres:14
    environment:
      POSTGRES_DB: user-service
      POSTGRES_USER: user2
      POSTGRES_PASSWORD: password2
    volumes:
      - 'user-service-2_data:/var/lib/postgresql/data'
    ports:
      - '5633:5432'

  auth-service-3:
    image: postgres:14
    environment:
      POSTGRES_DB: auth-service
      POSTGRES_USER: user3
      POSTGRES_PASSWORD: password3
    volumes:
      - 'auth-service-3_data:/var/lib/postgresql/data'
    ports:
      - '5634:5432'

  payments-service-5:
    image: postgres:14
    environment:
      POSTGRES_DB: payments-service
      POSTGRES_USER: user5
      POSTGRES_PASSWORD: password5
    volumes:
      - 'payments-service-5_data:/var/lib/postgresql/data'
    ports:
      - '5639:5432'

volumes:
  kafka_data:
    driver: local
  mongodb-booking-service_data:
    driver: local  
  mongodb-offers-service_data:
    driver: local  
  admin-service-1_data:
    driver: local
  user-service-2_data:
    driver: local
  auth-service-3_data:
    driver: local
  payments-service-5_data:
    driver: local


networks:
  default:
    name: kafka-network
    driver: bridge
